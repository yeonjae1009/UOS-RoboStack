input_path: box_sequence
output_dir: algorithm_results

pallet:
  length: 1.2
  width: 1.0
  height: 1.25

json:
  indent: 2
  ensure_ascii: false

algorithm:
  allow_rotation: true            # 박스 Z축 기준 90도 회전 허용 여부
  min_support: 0.64               # 기본 상단 적재 최소 지지율; 작은 footprint 박스는 코드에서 0.60까지 완화
  emergency_support: 0.45         # 단일 다음 박스를 전혀 못 놓을 때만 쓰는 최후 완화 지지율
  beam_width: 8                   # 단계별 유지할 탐색 상태 수
  beam_depth: 1                   # 현재 버퍼 내부 탐색 깊이
  positions_per_box: 1            # 박스별 유지할 후보 위치 수
  enable_adaptive_sku_columns: true
  sku_column_duplicate_count: 2
  sku_column_max_height: 0.85
  sku_column_min_footprint_area: 0.0
  sku_column_max_footprint_area: 0.060
  sku_column_confirmation_boxes: 15
  sku_column_min_observed_types: 5
  sku_column_large_aspect_ratio_min: 1.10
############# 아래는 사용자가 입력하는 설정값입니다. #############
buffer:
  size: 0                         # 버퍼 슬롯 수, 프로세스 시작 후 변경하지 않음
