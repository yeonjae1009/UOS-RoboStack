#input_path: random_spec_eval_10/box_sequence
#output_dir: algorithm_results_eval10
input_path: test_box_sequence_250
output_dir: test_box_sequence_250_result
#input_path: box_sequence
#output_dir: algorithm_results
pallet:
  length: 1.2
  width: 1.0
  height: 1.25

json:
  indent: 2
  ensure_ascii: false

algorithm:
  allow_rotation: true            # 박스 Z축 기준 90도 회전 허용 여부
############# 아래는 사용자가 입력하는 설정값입니다. #############
buffer:
  size: 0                  # 버퍼 슬롯 수, 동시에 대기 가능한 박스 수

search:
  enabled: true
  mode: beam                     # one_step 또는 beam
  score_profile: sun_v2     # legacy 또는 geometry_v1
  top_k_leaf: 4
  candidate_union_enabled: false
  candidate_union_mode: adaptive # 일반 입력은 단일 정책, 증가순 adversarial이면 union rerank
  union_top_k_per_model: 4      # 각 ONNX 모델별 top-K 후보 수 (3개 모델이면 최대 12개 union 후보)
  union_fallback_top_k_leaf: 20 # union 후보가 전부 실패할 때 첫 정책의 top-K까지 확장
  candidate_union_score_profile: legacy # no-buffer union rerank 전용 점수
  beam_width: 2
  depth: 2
  non_buffer_enabled: false
  rollout_depth: 2
  pseudo_samples: 4
  rollout_weight: 0.1
  rollout_discount: 0.7
  time_budget_sec: 80.0
  random_seed: 0

selector:
  enabled: true                  # true면 search score에 selector 점수를 작은 bonus로 추가
  model_path: src/models/buffer_selector.onnx
  buffer_size: 3
  bonus_weight: 0.10
